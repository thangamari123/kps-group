name = "kps-backend-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://www.kpsgroups.net,https://kpsgroups.net,http://localhost:3000,http://127.0.0.1:3000"
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "kps-website-hr-panel"

# Cloudflare R2 Bucket Binding for Candidate Resumes
[[r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "kps-media"
preview_bucket_name = "kps-media-dev"

# Cloudflare R2 Bucket Binding for CMS Media Assets
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "kps-media"
preview_bucket_name = "kps-media-dev"
