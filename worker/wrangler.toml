name = "kps-backend-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://www.kpsgroups.net,https://kpsgroups.net,http://localhost:3000,http://127.0.0.1:3000"
ENVIRONMENT = "production"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kps-db"
database_id = "kps-d1-database-id-placeholder"
migrations_dir = "migrations"

# Cloudflare R2 Bucket Binding for Resumes
[[r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "kps-resumes"
preview_bucket_name = "kps-resumes-preview"
